<!DOCTYPE html>
<html>
<head>
    <title>后端测试</title>
</head>
<body>
    <h1>后端API测试</h1>
    <button onclick="testLogin()">测试登录</button>
    <button onclick="testMealAPI()">测试餐饮API</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: '王金彪',
                        password: '123456'
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = '<h3>登录测试结果:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<h3>登录测试错误:</h3><pre>' + error.message + '</pre>';
            }
        }

        async function testMealAPI() {
            try {
                const response = await fetch('http://localhost:8080/api/meal/test');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<h3>餐饮API测试结果:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<h3>餐饮API测试错误:</h3><pre>' + error.message + '</pre>';
            }
        }
    </script>
</body>
</html>
